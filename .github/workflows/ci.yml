name: CI

# Sparsam: läuft bei Pull Requests, Pushes auf main und Version-Tags (v1.2.3, zusätzlich signiertes Play-Store-Bundle),
# sonst nur auf Knopfdruck. Reine Doku- und Quellen-Änderungen lösen keinen Lauf aus.
on:
  push:
    branches: ['main']
    tags: ['v*']
    paths-ignore: ['content/quellen/**', 'docs/**', '**.md']
  pull_request:
    paths-ignore: ['content/quellen/**', 'docs/**', '**.md']
  workflow_dispatch:

concurrency:
  # Knopfdruck-Läufe (z. B. für iOS) werden nicht von späteren Pushes abgebrochen
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Regeln, Oberfläche, Browser, App)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Browser installieren (bis zu 3 Versuche, je höchstens 5 Minuten)
        run: for i in 1 2 3; do timeout 300 npx playwright install --with-deps chromium && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Regel- und Oberflächentests
        run: npm test
      - name: Browsertest (Behinderung, Mappe, Sprachen, RTL)
        run: npm run test:e2e
      - name: App-Test (offline, CSP, PDF, Scan, Speichern)
        run: npm run test:app
      - name: Web-Version als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: sozialleistungslotse-web
          path: dist/sozialleistungslotse.html

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm run build:app
      - name: Debug-APK (zum Testen auf dem Handy)
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Signatur prüfen (fester Test-Schlüssel, damit Updates ohne Deinstallieren gehen)
        run: |
          AS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$AS" verify --print-certs app/android/app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/cert.txt"
          grep -qi "SHA-256 digest: 2e2df4ead968b510de7d000f2a4c193e82add2f3aa2d0cd81f22aa0e52da9563" "$RUNNER_TEMP/cert.txt" \
            || { echo "::error::Test-APK ist nicht mit app/android/debug.keystore signiert"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
      - name: Signiertes App-Bundle für den Play Store (nur bei Version-Tag und vorhandenen Secrets)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: android-release-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  ios:
    name: iOS (Simulator-Build)
    needs: test
    # Mac-Rechner sind bei GitHub knapp: iOS nur für main, Pull Requests, Version-Tags und auf Knopfdruck (Actions → CI → Run workflow)
    # iOS (Mac-Rechner) nur für Releases und auf Knopfdruck
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Intel-Mac: die arm64-Mac-Runner waren mehrfach ausgelastet (Job nach 15 Minuten nicht zugeteilt)
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm run build:app
      - name: Für den Simulator bauen (ohne Signatur; prüft, dass Projekt und Plugins kompilieren)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          exit ${PIPESTATUS[0]}
