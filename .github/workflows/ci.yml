name: CI

# Sparsam: läuft bei Pull Requests, Pushes auf main und Version-Tags (v1.2.3, zusätzlich signiertes Play-Store-Bundle),
# sonst nur auf Knopfdruck. Der Workflow startet IMMER (kein paths-ignore), damit der Pflicht-Check
# „Tests (Regeln, Oberfläche, Browser, App)“ auch bei reinen Doku-PRs erscheint und Auto-Merge nicht hängen bleibt.
# Der Job „Änderungen“ erkennt reine Markdown- und Quellen-Änderungen (**.md, content/quellen/**); dann werden die
# teuren Jobs übersprungen und der Pflicht-Check meldet „success“. docs/*.html zählt NICHT als Doku: dort liegen die
# GitHub-Pages-Seiten (datenschutz*.html, index.html), die ein Test mit site/ vergleicht.
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Knopfdruck-Läufe (z. B. für iOS) werden nicht von späteren Pushes abgebrochen
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pfadfilter: code=false nur, wenn JEDE geänderte Datei Markdown oder unter content/quellen/ ist.
  # Im Zweifel (Tag, Knopfdruck, neuer Branch, leere Liste, git-Fehler) code=true, also volle Tests.
  aenderungen:
    name: Änderungen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none   # ganze Historie ohne Dateiinhalte: schnell, reicht für git diff --name-only
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          code=true; bereich=''
          if [ "$EVENT" = pull_request ]; then bereich="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ] && [[ "$REF" == refs/heads/* ]] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then bereich="$BEFORE..$AFTER"
          fi
          if [ -n "$bereich" ] && dateien=$(git diff --name-only "$bereich"); then
            echo "Geänderte Dateien ($bereich):"; echo "$dateien"
            if [ -n "$dateien" ] && ! grep -qvE '(\.md$|^content/quellen/)' <<< "$dateien"; then code=false; fi
          else
            echo "Kein Vergleich möglich ($EVENT, $REF): volle Tests"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then echo "Nur Markdown/Quellen geändert: teure Jobs werden übersprungen, Pflicht-Check meldet success." | tee -a "$GITHUB_STEP_SUMMARY"; fi

  regeln:
    name: Tests a (Lint, Regeln, Oberfläche, Erweiterungen)
    needs: aenderungen
    if: needs.aenderungen.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Playwright-Version für den Browser-Zwischenspeicher
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Browser aus dem Zwischenspeicher
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Browser installieren (bis zu 3 Versuche, je höchstens 10 Minuten, wartet auf apt)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99lock >/dev/null; for i in 1 2 3; do timeout 600 npx playwright install --with-deps chromium && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Systempakete für den Browser (bei Treffer im Zwischenspeicher)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99lock >/dev/null; for i in 1 2 3; do timeout 600 npx playwright install-deps chromium && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Lint (nicht deklarierte Namen, unbenutzte Variablen)
        run: npm run lint
      # Wie „npm test“ (build:web, test:rules, test:dom), nur 3 Tests gleichzeitig: dieselben Testlisten (test/listen/*.txt),
      # jeder Test als eigener Prozess; rot, sobald einer rot ist, abstürzt oder beendet wird (Tabelle am Ende des Schritts).
      - name: Web-Version bauen
        run: npm run build:web
      - name: Regel- und Oberflächentests (3 gleichzeitig)
        run: node tools/tests.js regeln oberflaeche -j 3
      - name: Erweiterungen (Prüfpaket, mit Browsertest der Vorschau)
        run: npm run test:erweiterungen

  # Browsertests in parallelen Teilen (vorher ein Job mit ca. 8 Minuten, davon 5,5 Minuten Zufalls-Klicktest).
  # Die Teile stehen in package.json (e2e:basis, e2e:zufall). Ein Schritt prüft, dass sie zusammen genau test:e2e abdecken
  # (kein neuer Browsertest geht in CI verloren). test:e2e selbst bleibt für lokale Läufe unverändert.
  # Zufalls-Klicktest: SHARD=k/2, jeder Teil 200 der 400 Schritte mit eigenem Startwert (zusammen derselbe Umfang).
  # Höchstens 2 Teile: jeder Teil braucht mindestens 151 Schritte für den festen Besuch der Antragsmappe (Schritt 150).
  browser:
    name: Tests b (${{ matrix.teil }})
    needs: aenderungen
    if: needs.aenderungen.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - teil: Browser – Fälle, einfach, klein, Briefe, Pflege, PDF, Barrierefreiheit
            skript: e2e:basis
            web: true
            shard: ''
          - teil: Browser – Zufalls-Klicktest 1/2
            skript: e2e:zufall
            web: true
            shard: '1/2'
          - teil: Browser – Zufalls-Klicktest 2/2
            skript: e2e:zufall
            web: true
            shard: '2/2'
          - teil: App – offline, CSP, PDF, Scan, Speichern
            skript: test:app
            web: false
            shard: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Playwright-Version für den Browser-Zwischenspeicher
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Browser aus dem Zwischenspeicher
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Browser installieren (bis zu 3 Versuche, je höchstens 10 Minuten, wartet auf apt)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99lock >/dev/null; for i in 1 2 3; do timeout 600 npx playwright install --with-deps chromium && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Systempakete für den Browser (bei Treffer im Zwischenspeicher)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99lock >/dev/null; for i in 1 2 3; do timeout 600 npx playwright install-deps chromium && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Decken die Teile genau test:e2e ab?
        if: matrix.skript == 'e2e:basis'
        run: |
          node -e '
            const s = require("./package.json").scripts, teile = (x) => x.split("&&").map((t) => t.trim()).filter((t) => !t.startsWith("npm run build:web"));
            const soll = teile(s["test:e2e"]).sort(), ist = [...teile(s["e2e:basis"]), ...teile(s["e2e:zufall"])].sort();
            if (JSON.stringify(soll) !== JSON.stringify(ist)) { console.log("::error::e2e:basis + e2e:zufall weichen von test:e2e ab\nsoll: " + soll.join(" | ") + "\nist:  " + ist.join(" | ")); process.exit(1); }
            console.log("Teile = test:e2e (" + soll.length + " Testdateien)");'
      - name: Web-Version bauen
        if: matrix.web
        run: npm run build:web
      # Wackelschutz: bei Fehlschlag genau einmal wiederholen, mit Warnung im Log, in der Zusammenfassung und als Hinweis
      # am Pull Request. Ein echter Fehler (Startwerte fest) scheitert auch im zweiten Versuch. Lokal gibt es keine Wiederholung.
      - name: Test ${{ matrix.skript }} (bei Fehlschlag einmal wiederholt)
        env:
          SHARD: ${{ matrix.shard }}
          SKRIPT: ${{ matrix.skript }}
          # Zufalls-Klicktest: zu wenig Abdeckung nur als Warnung; die Pflichtbesuche prüft test/e2e-rundgang.js (in e2e:basis)
          ZUFALL_ABDECKUNG: warnen
        run: |
          if npm run "$SKRIPT"; then exit 0; fi
          echo "::warning title=Browsertest wiederholt::$SKRIPT ${SHARD:+(Teil $SHARD) }ist beim ersten Versuch fehlgeschlagen und wird einmal wiederholt. Bestehen im zweiten Versuch heißt: wackliger Test oder zeitabhängiger Fehler, bitte ansehen."
          echo "**wiederholt:** \`$SKRIPT\` ${SHARD:+(Teil $SHARD) }ist beim ersten Versuch fehlgeschlagen und wurde einmal wiederholt." >> "$GITHUB_STEP_SUMMARY"
          echo "===== wiederholt: $SKRIPT ${SHARD:+(Teil $SHARD) }– zweiter und letzter Versuch ====="
          npm run "$SKRIPT"
      - name: Web-Version als Artefakt
        if: matrix.skript == 'e2e:basis'
        uses: actions/upload-artifact@v7
        with:
          name: sozialleistungslotse-web
          path: dist/sozialleistungslotse.html

  # Abschluss mit dem bisherigen Namen: Pflicht-Check für main (Auto-Merge). Läuft immer (always()).
  # Grün nur, wenn „Änderungen“ erfolgreich war UND
  #  - bei Code-Änderungen: Teil a, alle Matrix-Teile von b und Android „success“ sind,
  #  - bei reinen Doku-Änderungen: diese Jobs „skipped“ (oder success) sind.
  # failure, cancelled oder ein unerwartetes skipped bei Code-Änderungen ergeben rot.
  test:
    name: Tests (Regeln, Oberfläche, Browser, App)
    needs: [aenderungen, regeln, browser, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alle Teile bestanden?
        env:
          FILTER: ${{ needs.aenderungen.result }}
          CODE: ${{ needs.aenderungen.outputs.code }}
          A: ${{ needs.regeln.result }}
          B: ${{ needs.browser.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          echo "Änderungen: $FILTER (code=$CODE) | Teil a: $A | Teil b (alle Teile): $B | Android: $ANDROID"
          [ "$FILTER" = success ] || { echo "::error::Pfadfilter nicht erfolgreich"; exit 1; }
          for r in "$A" "$B" "$ANDROID"; do
            if [ "$CODE" = true ]; then [ "$r" = success ] || { echo "::error::Teiljob nicht bestanden ($r)"; exit 1; }
            else [ "$r" = skipped ] || [ "$r" = success ] || { echo "::error::Teiljob nicht bestanden ($r)"; exit 1; }
            fi
          done
          echo "Pflicht-Check bestanden"

  # Läuft parallel zu den Tests (braucht sie nicht zum Kompilieren); der Abschluss-Check oben verlangt ihn trotzdem.
  android:
    name: Android
    needs: aenderungen
    if: needs.aenderungen.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm run build:app
      - name: Debug-APK (zum Testen auf dem Handy)
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Signatur prüfen (fester Test-Schlüssel, damit Updates ohne Deinstallieren gehen)
        run: |
          AS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$AS" verify --print-certs app/android/app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/cert.txt"
          grep -qi "SHA-256 digest: 2e2df4ead968b510de7d000f2a4c193e82add2f3aa2d0cd81f22aa0e52da9563" "$RUNNER_TEMP/cert.txt" \
            || { echo "::error::Test-APK ist nicht mit app/android/debug.keystore signiert"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
      - name: Signiertes App-Bundle für den Play Store (nur bei Version-Tag und vorhandenen Secrets)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: android-release-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  ios:
    name: iOS (Simulator-Build)
    needs: test
    # Mac-Rechner sind bei GitHub knapp: iOS nur für main, Pull Requests, Version-Tags und auf Knopfdruck (Actions → CI → Run workflow)
    # iOS (Mac-Rechner) nur für Releases und auf Knopfdruck
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Intel-Mac: die arm64-Mac-Runner waren mehrfach ausgelastet (Job nach 15 Minuten nicht zugeteilt)
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm run build:app
      - name: Für den Simulator bauen (ohne Signatur; prüft, dass Projekt und Plugins kompilieren)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          exit ${PIPESTATUS[0]}
