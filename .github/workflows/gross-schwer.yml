# Schwerer Abgleich mit den amtlichen Rechnern (Fälle, die der erste große Abgleich nicht hatte):
#  wg2      3.000 Wohngeld-Haushalte: bis 8 Personen, Renten-Paare, angegebene Heizkosten, Alleinerziehende, sehr kleine/große Einkommen
#  wggrenz  1.000 Wohngeld-Haushalte genau an einer Einstufungsgrenze von SoLo (± 10 €)
#  kiz2     3.000 Familien im KiZ-Lotsen: Partner mit Einkommen, Unterhalt, Kinder 5/6/7 und 13/14 Jahre, bis 6 Kinder
#  kizgrenz   500 Familien genau an einer Einstufungsgrenze von SoLo
# Startet, wenn tools/amtliche-rechner/gross-auftrag-schwer.txt geändert wird (nur auf Arbeitszweigen), oder von Hand.
name: Schwerer Abgleich amtliche Rechner

on:
  push:
    branches-ignore: ['main']   # nur auf Arbeitszweigen (schreibt Testfälle in den Zweig)
    paths: ['tools/amtliche-rechner/gross-auftrag-schwer.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abfragen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: [{"art": "wg2", "n": 3000, "teile": 15, "teil": 0}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 1}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 2}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 3}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 4}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 5}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 6}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 7}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 8}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 9}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 10}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 11}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 12}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 13}, {"art": "wg2", "n": 3000, "teile": 15, "teil": 14}, {"art": "wggrenz", "n": 1000, "teile": 5, "teil": 0}, {"art": "wggrenz", "n": 1000, "teile": 5, "teil": 1}, {"art": "wggrenz", "n": 1000, "teile": 5, "teil": 2}, {"art": "wggrenz", "n": 1000, "teile": 5, "teil": 3}, {"art": "wggrenz", "n": 1000, "teile": 5, "teil": 4}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 0}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 1}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 2}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 3}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 4}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 5}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 6}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 7}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 8}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 9}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 10}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 11}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 12}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 13}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 14}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 15}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 16}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 17}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 18}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 19}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 20}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 21}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 22}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 23}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 24}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 25}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 26}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 27}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 28}, {"art": "kiz2", "n": 3000, "teile": 30, "teil": 29}, {"art": "kizgrenz", "n": 500, "teile": 5, "teil": 0}, {"art": "kizgrenz", "n": 500, "teile": 5, "teil": 1}, {"art": "kizgrenz", "n": 500, "teile": 5, "teil": 2}, {"art": "kizgrenz", "n": 500, "teile": 5, "teil": 3}, {"art": "kizgrenz", "n": 500, "teile": 5, "teil": 4}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Browser installieren (bis zu 3 Versuche)
        run: for i in 1 2 3; do timeout 300 npx playwright install --with-deps chromium && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Amtlichen Rechner abfragen
        run: node tools/amtliche-rechner/gross.js ${{ matrix.art }} ${{ matrix.n }} ${{ matrix.teil }} ${{ matrix.teile }} gross-${{ matrix.art }}-${{ matrix.teil }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gross-${{ matrix.art }}-${{ matrix.teil }}
          path: gross-${{ matrix.art }}-${{ matrix.teil }}.json
          if-no-files-found: warn

  auswerten:
    needs: abfragen
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { path: ergebnis, pattern: 'gross-*' }
      - name: SoLo gegen amtliche Ergebnisse
        shell: bash
        run: node tools/amtliche-rechner/gross-auswerten.js ergebnis --fixtures | tee auswertung.txt
      # Die amtlichen Ergebnisse als feste Testfälle (test/amtlich-gross-*.json) in den Zweig schreiben, auch wenn es Abweichungen gibt
      - name: Testfälle speichern
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/amtlich-gross-*.json
          git diff --cached --quiet && exit 0
          git commit -m "Amtliche Ergebnisse aus dem großen Abgleich als feste Testfälle ($(tr -d '\n' < auswertung.txt | cut -c1-200))"
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gross-ergebnis, path: 'ergebnis/**' }
