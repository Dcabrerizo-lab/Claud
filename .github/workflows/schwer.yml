name: Schwere Tests

# Große Testläufe: viele Millionen Haushalte gegen die unabhängige Referenzrechnung, Logik-Test mit 1 Million Haushalten,
# vollständiger Mutationstest, Browsertests in Firefox und WebKit (Safari), die echte App im Android-Emulator (Android 8, 11, 15)
# und der iOS-Build. Sparsam: nur von Hand (Actions -> Schwere Tests
# -> Run workflow), sonntags automatisch und einmal, wenn diese Datei geändert wird. Browsertests (4 Teile je Browser)
# und Mutationstest (3 Teile) laufen parallel; Dauer etwa 20 bis 30 Minuten (längster Job: Rastertest bzw. Android-Emulator).
# (Die Knopfdruck-Variante erscheint erst, wenn diese Datei auch im Haupt-Branch liegt.)
# Zusätzlich: schwer-regeln.yml ruft bei Push auf main mit Änderung an src/rules.js nur die Rechen-Jobs auf
# (Rastertest, Logik-Test, Mutationstest; nur_logik: true). Browser, Emulator und iOS bleiben bei Sonntag/Release/Knopfdruck.
on:
  workflow_call:
    inputs:
      nur_logik:
        description: Nur Rastertest, Logik-Test und Mutationstest (ohne Browser, Emulator, iOS)
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * 0'   # jeden Sonntag früh, damit Umbauten nicht tagelang unbemerkt Tests brechen
  push:
    paths: ['.github/workflows/schwer.yml']

permissions:
  contents: read

concurrency:
  group: schwer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  raster:
    name: Rastertest 3 Millionen Haushalte
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - name: App gegen unabhängige Referenz (3.000.000 Zufallshaushalte plus feste Raster)
        run: node test/test-raster.js 3000000

  eigenschaften:
    name: Logik-Test 1 Million Haushalte
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Monotonie und Widerspruchsfreiheit (1.000.000 Haushalte)
        run: node test/test-eigenschaften.js 1000000
      - name: Dasselbe nach dem Jahreswechsel (Werte 2027, 300.000 Haushalte)
        run: HEUTE=2027.05 node test/test-eigenschaften.js 300000

  mutation:
    name: Mutationstest Teil ${{ matrix.teil }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci
        working-directory: app
      - name: Playwright-Version für den Browser-Zwischenspeicher
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Browser aus dem Zwischenspeicher
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Browser installieren (bis zu 3 Versuche, je höchstens 10 Minuten, wartet auf apt)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99lock >/dev/null; for i in 1 2 3; do timeout 600 npx playwright install --with-deps chromium && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Systempakete für den Browser (bei Treffer im Zwischenspeicher)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99lock >/dev/null; for i in 1 2 3; do timeout 600 npx playwright install-deps chromium && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Alle Tests einmal sauber
        run: npm test
      - name: Eingebaute Fehler müssen alle entdeckt werden (jede 3. Mutation; alle drei Teile zusammen = alle)
        env: { MUT_RASTER: '60000', MUT_EIGEN: '15000', SHARD: '${{ matrix.teil }}/3' }
        run: node tools/mutationstest.js

  browser:
    name: Browsertests ${{ matrix.browser }} Teil ${{ matrix.teil }}/4
    if: ${{ !inputs.nur_logik }}
    runs-on: ubuntu-latest
    timeout-minutes: 40   # ein Viertel der Arbeit; ungeteilt brauchte der Job bis 75 Minuten
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        teil: [1, 2, 3, 4]
    env:
      BROWSER: ${{ matrix.browser }}
      SHARD: ${{ matrix.teil }}/4   # jeder Teil prüft jede 4. Sprache bzw. Kombination; alle 4 Teile zusammen = alles
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Playwright-Version für den Browser-Zwischenspeicher
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Browser aus dem Zwischenspeicher
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Browser installieren (bis zu 3 Versuche, je höchstens 10 Minuten, wartet auf apt)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99lock >/dev/null; for i in 1 2 3; do timeout 600 npx playwright install --with-deps ${{ matrix.browser }} && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Systempakete für den Browser (bei Treffer im Zwischenspeicher)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99lock >/dev/null; for i in 1 2 3; do timeout 600 npx playwright install-deps ${{ matrix.browser }} && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - run: npm run build:web
      - name: Ausführliche Version (Fälle, Mappe, PLZ; Sprachen dieses Teils)
        run: node test/e2e-beh.js
      - name: Einfache Version (Fälle; Sprachen dieses Teils)
        run: node test/e2e-einfach.js
      - name: Kleine Handys und große Schrift (320 px, Systemschrift 200 %; Kombinationen dieses Teils)
        run: node test/e2e-klein.js
      # Feste Besuche (einfache Version, Antragsmappe) werden bis zu 10 Schritte wiederholt, damit auch 500 Schritte je Teil alle Bereiche erreichen
      - name: Zufalls-Klicktest (2.000 zufällige Bedienschritte, je Teil 500 mit eigenem Startwert)
        env: { ZUFALL_SEED: '${{ github.run_number }}' }
        run: node test/e2e-zufall.js 2000

  android-geraete:
    name: Android-Emulator API ${{ matrix.api }}
    if: ${{ !inputs.nur_logik }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm run build:app
      - name: Debug-APK bauen (alte Version 1000 und neue Version 1001 für den Update-Test)
        working-directory: app/android
        run: |
          VERSION_CODE=1000 ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ${{ github.workspace }}/app-alt.apk
          VERSION_CODE=1001 ./gradlew --no-daemon assembleDebug
      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: App im Emulator installieren, starten, bedienen, PDF teilen, Update über die alte Version
        uses: reactivecircus/android-emulator-runner@v2
        env: { ALT_APK: app-alt.apk }
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/emulator-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}
          path: |
            emulator-*.png
            ui-*.xml
          if-no-files-found: ignore

  ios:
    name: iOS (Simulator-Build)
    if: ${{ !inputs.nur_logik }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm run build:app
      - name: Für den Simulator bauen (ohne Signatur)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          exit ${PIPESTATUS[0]}
