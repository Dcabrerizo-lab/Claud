name: Quellen abrufen

# Lädt die amtlichen Quellen (content/quellen/QUELLEN.txt) herunter und legt sie mit Abrufdatum im Repo ab.
# Läuft, wenn sich die Quellenliste ändert, und auf Knopfdruck (Actions -> "Quellen abrufen" -> Run workflow).
on:
  push:
    paths: ['content/quellen/QUELLEN.txt']
  workflow_dispatch:
    inputs:
      alle:
        description: 'Alle Quellen neu laden (sonst nur neue oder fehlende)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  abrufen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Herunterladen
        env:
          ALLE: ${{ inputs.alle && '1' || '0' }}
        run: |
          mkdir -p content/quellen/roh
          python3 - <<'PY'
          import json, hashlib, subprocess, datetime, pathlib, os
          # Ehrliche Kennung: Seiten, die automatische Abrufe ablehnen, werden nicht umgangen, sondern als fehlend protokolliert.
          ua = "Leistungs-Lotse-Datenabruf/1.0 (+https://github.com/" + os.environ["GITHUB_REPOSITORY"] + ")"
          out, log = pathlib.Path("content/quellen/roh"), []
          alt = {}
          try: alt = {e["datei"]: e for e in json.load(open("content/quellen/abruf.json", encoding="utf-8"))}
          except Exception: pass
          alle = os.environ.get("ALLE") == "1"
          for line in open("content/quellen/QUELLEN.txt", encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"): continue
              name, url = line.split(None, 1)
              f = out / name
              e0 = alt.get(name)
              # Schon abgerufen (erfolgreich oder gescheitert) und URL unverändert: nicht erneut laden (außer "alle")
              if not alle and e0 and e0.get("url") == url and (f.exists() or not e0.get("ok")):
                  log.append(e0); continue
              r = subprocess.run(["curl", "-sSL", "-A", ua, "--retry", "2", "--connect-timeout", "20", "--max-time", "90",
                                  "-o", str(f), "-w", "%{http_code}", url], capture_output=True, text=True)
              code = int(r.stdout.strip()) if r.stdout.strip().isdigit() else 0
              ok = code == 200 and f.exists() and f.stat().st_size > 0
              if not ok and f.exists(): f.unlink()
              e = {"datei": name, "url": url, "http": code, "ok": ok,
                   "bytes": f.stat().st_size if ok else 0,
                   "sha256": hashlib.sha256(f.read_bytes()).hexdigest() if ok else None,
                   "abgerufen": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}
              print(("OK    " if ok else "FEHLT ") + f"{code} {e['bytes']:>9} {name} {r.stderr.strip()[:120]}")
              log.append(e)
          json.dump(log, open("content/quellen/abruf.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
      - name: Ins Repo übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/quellen
          git diff --cached --quiet && { echo "Keine Änderungen"; exit 0; }
          git commit -m "Quellen abgerufen ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
