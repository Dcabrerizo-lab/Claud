# iOS-App bauen, signieren und zu App Store Connect (TestFlight) hochladen – ohne eigenen Mac.
# Start von Hand (Actions -> „iOS zu TestFlight“ -> Run workflow). Braucht vier Repository-Secrets:
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_TEAM_ID, APPSTORE_KEY_P8 (Inhalt der .p8-Datei)
# Die Signatur erstellt Xcode selbst über den API-Schlüssel (automatische Signierung, -allowProvisioningUpdates).
name: iOS zu TestFlight

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build-Nummer (muss bei jedem Hochladen größer werden, z. B. 110)'
        required: true
        default: '110'

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEYID: ${{ secrets.APPSTORE_KEY_ID }}
      TEAM: ${{ secrets.APPSTORE_TEAM_ID }}
    steps:
      - name: Secrets vorhanden?
        env:
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          fehlt=""
          for n in ISSUER KEYID TEAM P8; do [ -n "${!n}" ] || fehlt="$fehlt $n"; done
          if [ -n "$fehlt" ]; then echo "::error::Es fehlen Secrets:$fehlt (Settings -> Secrets and variables -> Actions)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: npm run build:app
      - name: Nur der Sozialleistungslotse (Bundle-ID prüfen)
        run: |
          ids=$(grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*' app/ios/App/App.xcodeproj/project.pbxproj | sort -u)
          echo "$ids"
          if [ "$ids" != "PRODUCT_BUNDLE_IDENTIFIER = com.Sozialleistungslotse" ]; then echo "::error::Falsche Bundle-ID – hier wird nur SoLo (com.Sozialleistungslotse) hochgeladen"; exit 1; fi
      - name: API-Schlüssel ablegen
        env:
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/key"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/key/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/key/AuthKey.p8"
      - name: Archiv bauen (Release, signiert)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SoLo.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/key/AuthKey.p8" -authenticationKeyID "$KEYID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ inputs.build }}" MARKETING_VERSION=1.0.0 \
            archive | tail -80
          exit ${PIPESTATUS[0]}
      - name: Hochladen zu App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SoLo.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/key/AuthKey.p8" -authenticationKeyID "$KEYID" -authenticationKeyIssuerID "$ISSUER" | tail -60
          exit ${PIPESTATUS[0]}
      - name: Schlüssel löschen
        if: always()
        run: rm -rf "$RUNNER_TEMP/key"
