name: Bürokratie-App

# Tests des Unterprojekts buerokratie-app/ (unabhängig vom Leistungs-Lotsen)
on:
  push:
    paths: ['buerokratie-app/**', '.github/workflows/buerokratie.yml']
  pull_request:
    paths: ['buerokratie-app/**', '.github/workflows/buerokratie.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: buerokratie-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: buerokratie-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
