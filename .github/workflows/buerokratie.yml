name: Bürokratie-App

# Tests des Unterprojekts buerokratie-app/ (unabhängig vom Leistungs-Lotsen)
on:
  push:
    paths: ['buerokratie-app/**', '.github/workflows/buerokratie.yml']
  pull_request:
    paths: ['buerokratie-app/**', '.github/workflows/buerokratie.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: buerokratie-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: buerokratie-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browsertest (Einrichten, Entsperren, Wiederherstellen, kein Klartext, kein Netz)
        run: npm run test:e2e
      - name: Offline-Nachweis Texterkennung (Foto-Weg)
        run: npm run test:offline
      - name: Browsertests in Firefox und WebKit (Safari)
        run: |
          npx playwright install --with-deps firefox webkit
          for b in firefox webkit; do BROWSER=$b node test/e2e/app.e2e.mjs && BROWSER=$b node test/e2e/robust.e2e.mjs && BROWSER=$b node test/e2e/backup.e2e.mjs && BROWSER=$b node test/e2e/a11y.e2e.mjs && BROWSER=$b SESSIONS=8 node test/e2e/fuzz.e2e.mjs; done
      - name: App als einzelne HTML-Datei
        uses: actions/upload-artifact@v4
        with:
          name: daten-tresor-web
          path: buerokratie-app/dist/daten-tresor.html
