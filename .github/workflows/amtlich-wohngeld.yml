# Differenztest Wohngeld: SoLo gegen den amtlichen Wohngeldrechner des BMWSB (Wohngeld-Plus-Rechner ab 1.1.2025, Rechtsstand 2026).
# Nur von Hand (workflow_dispatch). Ein einziger Rechner, nacheinander, mindestens 2 s Pause je Abfrage (robots.txt: Crawl-delay 1),
# höchstens 400 Haushalte je Lauf. Ergebnis: Artefakt "amtlich-wohngeld" (JSON mit Eingaben und amtlichem Betrag) und Auswertung.
# Auswertung lokal: node tools/amtlich-vergleich-wohngeld.js <amtlich-wohngeld.json>
name: Amtlich Wohngeld (Differenztest)

# GitHub startet workflow_dispatch nur für Workflows, die schon auf main liegen. Bis dahin startet ein Push, der
# tools/amtliche-rechner/wg-differenz-auftrag.txt ändert (Zeile: "<modus> <anzahl> <startwert>"), denselben Lauf auf Arbeitszweigen.
on:
  push:
    branches-ignore: ['main']
    paths: ['tools/amtliche-rechner/wg-differenz-auftrag.txt']
  workflow_dispatch:
    inputs:
      anzahl:
        description: 'Zahl der Haushalte (höchstens 400)'
        default: '400'
      startwert:
        description: 'Startwert des Zufallsgenerators (gleicher Wert = gleiche Haushalte)'
        default: '2611'
      modus:
        description: 'abfrage oder erkunden (nur Formularfelder speichern)'
        default: 'abfrage'

permissions:
  contents: read

# Nicht doppelt bei den Behörden-Rechnern abfragen: höchstens ein Lauf je Zweig gleichzeitig (ein neuer wartet, bricht nichts ab).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  abfragen:
    # Nicht bei Merge-Commits starten: ein Merge in einen Bündel-Zweig enthält die Auftragsdatei schon und würde dieselben
    # Abfragen wiederholen (21.11.2026: 9 von 16 Läufen). Neuer Auftrag: Auftragsdatei in einem normalen Commit ändern.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MODUS: ${{ inputs.modus }}
      ANZAHL: ${{ inputs.anzahl }}
      START: ${{ inputs.startwert }}
    steps:
      - uses: actions/checkout@v7
      - name: Auftrag lesen (bei Push aus der Auftragsdatei)
        if: github.event_name == 'push'
        run: read m n s < tools/amtliche-rechner/wg-differenz-auftrag.txt; echo "MODUS=$m" >> "$GITHUB_ENV"; echo "ANZAHL=$n" >> "$GITHUB_ENV"; echo "START=$s" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Browser installieren (bis zu 3 Versuche)
        run: for i in 1 2 3; do timeout 300 npx playwright install --with-deps chromium && exit 0; echo "Versuch $i fehlgeschlagen"; sleep 20; done; exit 1
      - name: Formularfelder erkunden
        if: env.MODUS == 'erkunden'
        run: mkdir -p out && node tools/amtliche-rechner/wg-erkunden.js out/wg-felder.json
      - name: Amtlichen Rechner abfragen
        if: env.MODUS != 'erkunden'
        run: mkdir -p out && node tools/amtliche-rechner/wg-differenz.js "$ANZAHL" "$START" out/amtlich-wohngeld.json
      - name: SoLo gegen amtliche Ergebnisse
        if: env.MODUS != 'erkunden'
        run: node tools/amtlich-vergleich-wohngeld.js out/amtlich-wohngeld.json --md out/wohngeld-vergleich.md || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: amtlich-wohngeld, path: 'out/**' }
